<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Call - HomeService Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared.css" />
  <style>
    .call-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0b1a26 0%, #162d3f 50%, #1b8de8 100%);
      position: relative;
      z-index: 30;
    }

    .call-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 48px 40px;
      text-align: center;
      width: 360px;
      max-width: 92vw;
    }

    .call-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 2rem;
      color: #fff;
      margin: 0 auto 20px;
      position: relative;
    }

    .call-avatar.active-call::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 3px solid #22c55e;
      animation: callPulse 2s ease-in-out infinite;
    }

    @keyframes callPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.05); }
    }

    .call-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .call-status {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 12px;
    }

    .call-timer {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }

    .call-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .call-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.15s;
    }

    .call-btn:hover {
      transform: scale(1.08);
    }

    .call-btn svg {
      width: 22px;
      height: 22px;
    }

    .call-btn-mute {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .call-btn-mute:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .call-btn-mute.is-active {
      background: #ef4444;
      color: #fff;
    }

    .call-btn-speaker {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .call-btn-speaker:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .call-btn-speaker.is-off {
      background: rgba(255, 255, 255, 0.35);
      color: #d1d5db;
    }

    .call-btn-end {
      background: #ef4444;
      color: #fff;
      width: 64px;
      height: 64px;
    }

    .call-btn-end:hover {
      background: #dc2626;
    }

    .call-btn-chat {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .call-btn-chat:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .call-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    #dailyFrame {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
      border: 0;
      z-index: -1;
    }

    .call-error {
      margin-top: 20px;
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 14px;
      color: #fca5a5;
      font-size: 0.85rem;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      text-align: left;
      line-height: 1.5;
    }

    .retry-mic-btn {
      background: #fff;
      color: #b91c1c;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      display: none;
    }

    .retry-mic-btn:hover {
      background: #fecaca;
    }
  </style>
</head>

      body.hs-sidebar-open{overflow:hidden;}
      .main-content .header-actions{flex-wrap:wrap;}
      .call-page{min-height:calc(100vh - 56px)!important;}
    }
  </style>

  <script>
  (function() {
    if (!localStorage.getItem('is_logged_in')) { window.location.href = 'login.html'; return; }

    var myId = localStorage.getItem('id');
    var myName = localStorage.getItem('name') || 'Repairman';
    var myRole = localStorage.getItem('role') || 'repairman';

    var params = new URLSearchParams(window.location.search);
    var roomName = params.get('room') || '';
    var callId = params.get('call_id') || '';
    var mode = params.get('mode') || 'caller';
    var contactName = params.get('contact_name') || 'Unknown';

    document.querySelectorAll('.sidebar-user-name').forEach(function(el) { el.textContent = myName; });
    document.querySelectorAll('.sidebar-user-role').forEach(function(el) { el.textContent = 'Repairman'; });
    var myInitials = myName.split(' ').map(function(w){ return w[0]; }).join('').substring(0,2).toUpperCase();
    document.querySelectorAll('.sidebar-avatar').forEach(function(el) { el.textContent = myInitials; });

    function logout() {
      fetch('../../controllers/logout.php', { method: 'POST' })
        .then(function(){ localStorage.clear(); sessionStorage.clear(); window.location.href = 'login.html'; })
        .catch(function(){ localStorage.clear(); sessionStorage.clear(); window.location.href = 'login.html'; });
    }
    document.getElementById('logoutBtn').onclick = logout;

    if (!roomName) { window.location.href = 'chat.html'; return; }

    var callNameEl = document.getElementById('callName');
    var callStatusEl = document.getElementById('callStatus');
    var callTimerEl = document.getElementById('callTimer');
    var callAvatarEl = document.getElementById('callAvatar');
    var callErrorEl = document.getElementById('callError');
    var callErrorTextEl = document.getElementById('callErrorText');
    var retryMicBtn = document.getElementById('retryMicBtn');
    var muteBtn = document.getElementById('muteBtn');
    var speakerBtn = document.getElementById('speakerBtn');
    var endBtn = document.getElementById('endBtn');

    var contactInitials = (contactName).split(' ').map(function(w){ return w[0]; }).join('').substring(0,2).toUpperCase();
    callNameEl.textContent = contactName;
    callAvatarEl.textContent = contactInitials;

    var frame = null;
    var joined = false;
    var connected = false;
    var endTriggered = false;
    var muted = false;
    var speakerOn = true;
    var timerInterval = null;
    var ringInterval = null;
    var startTime = null;

    function setStatus(text, errorText, showRetry) {
      callStatusEl.textContent = text;
      if (errorText) {
        callErrorTextEl.textContent = errorText;
        callErrorEl.style.display = 'flex';
        retryMicBtn.style.display = showRetry ? 'inline-block' : 'none';
      } else {
        callErrorEl.style.display = 'none';
      }
    }

    function showMicrophoneToast(message) {
      showAlert(message, 'error');
      callAvatarEl.classList.remove('active-call');
    }

    function showMicPermissionHelp() {
      setStatus('Microphone required', 'Tap the padlock icon (aA) in your browser address bar, then set Microphone to "Allow". On mobile, check Settings > Safari/Chrome > Microphone.', true);
      showMicrophoneToast('Please allow microphone access to make calls.');
    }

    function showMicError(detail) {
      var msg = (detail || '').toLowerCase();
      if (!detail || msg.indexOf('permission') !== -1 || msg.indexOf('not allowed') !== -1) {
        showMicPermissionHelp();
        return;
      }
      if (msg.indexOf('not found') !== -1 || msg.indexOf('no device') !== -1) {
        setStatus('No microphone found', 'No microphone was detected on this device. Connect a microphone or headset and press Retry.', true);
        showMicrophoneToast('No microphone detected on this device.');
        return;
      }
      if (msg.indexOf('in use') !== -1 || msg.indexOf('busy') !== -1 || msg.indexOf('readable') !== -1) {
        setStatus('Microphone in use', 'Your microphone is being used by another app. Close it and press Retry.', true);
        showMicrophoneToast('Microphone is busy. Close other apps using it.');
        return;
      }
      showMicPermissionHelp();
    }

    function acquireMicrophoneAccess(onGranted) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('Microphone unavailable', 'Microphone access needs a secure connection (HTTPS). Open this site as https:// or via localhost.', false);
        showMicrophoneToast('Microphone requires HTTPS. Open the site over https://');
        return;
      }
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(stream) {
          stream.getTracks().forEach(function(t) { t.stop(); });
          onGranted();
        })
        .catch(function(err) {
          var name = (err && err.name) || '';
          if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
            showMicPermissionHelp();
          } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
            setStatus('No microphone found', 'No microphone was detected on this device. Connect a microphone or headset and press Retry.', true);
            showMicrophoneToast('No microphone detected on this device.');
          } else if (name === 'NotReadableError' || name === 'TrackStartError') {
            setStatus('Microphone in use', 'Your microphone is being used by another app. Close it and press Retry.', true);
            showMicrophoneToast('Microphone is busy. Close other apps using it.');
          } else {
            showMicPermissionHelp();
          }
        });
    }

    function formatTime(sec) {
      sec = Math.max(0, Math.floor(sec));
      var m = String(Math.floor(sec / 60)).padStart(2, '0');
      var s = String(sec % 60).padStart(2, '0');
      return m + ':' + s;
    }

    function renderTimer() {
      if (startTime === null) return;
      var elapsed = (Date.now() - startTime) / 1000;
      callTimerEl.textContent = formatTime(elapsed);
    }

    function startTimer() {
      if (timerInterval) return;
      startTime = Date.now();
      renderTimer();
      timerInterval = setInterval(renderTimer, 1000);
    }

    function stopTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      if (ringInterval) { clearInterval(ringInterval); ringInterval = null; }
    }

    function showConnectedUI() {
      connected = true;
      setStatus('Connected');
      callAvatarEl.classList.add('active-call');
      startTimer();
    }

    function endCall(finalStatus) {
      if (endTriggered) return;
      endTriggered = true;
      stopTimer();
      if (frame && joined) { try { frame.leave(); } catch(e) {} }
      if (callId) {
        var fd = new FormData();
        fd.append('call_id', callId);
        fd.append('status', finalStatus || 'ended');
        fetch('../../controllers/call/update.php', { method: 'POST', body: fd }).catch(function(){});
      }
      setTimeout(function() { window.location.href = 'chat.html'; }, 900);
    }

    function handleConnected() {
      if (connected) return;
      showConnectedUI();
      if (callId) {
        var fd = new FormData();
        fd.append('call_id', callId);
        fd.append('status', 'answered');
        fetch('../../controllers/call/update.php', { method: 'POST', body: fd }).catch(function(){});
      }
    }

    function buildFrame(token, roomUrl) {
      var factory = (window.DailyIframe && window.DailyIframe.createFrame) ? window.DailyIframe : (window.Daily ? window.Daily : null);
      if (!factory) {
        setStatus('Call SDK failed to load', 'Unable to load the call component. Please refresh and try again.');
        return;
      }
      frame = factory.createFrame({
        showLeaveButton: false,
        url: roomUrl,
        token: token,
        iframeStyle: { display: 'none' }
      });

      frame.on('joined-meeting', function() {
        joined = true;
        var remoteCount = 0;
        try {
          var parts = frame.participants() || {};
          Object.keys(parts).forEach(function(id) {
            if (id.indexOf('local') !== 0 && parts[id].user_name) remoteCount++;
          });
        } catch(e) {}
        if (remoteCount >= 1) { handleConnected(); }
        else { setStatus('Ringing...'); }
      });

      frame.on('participant-joined', function() { handleConnected(); });

      frame.on('participant-left', function(e) {
        if (joined && !endTriggered) {
          setStatus('Call ended');
          setTimeout(function() { endCall('ended'); }, 900);
        }
      });

      frame.on('left-meeting', function() {
        if (!endTriggered) { setTimeout(function() { endCall('ended'); }, 400); }
      });

      frame.on('error', function(e) {
        setStatus('Connection error', 'We could not connect the call. Check your internet connection and allow microphone access for this site.', true);
      });

      frame.on('camera-error', function(e) {
        showMicError(e && e.errorMsg ? e.errorMsg : null);
      });
      frame.on('network-connection', function() {});

      acquireMicrophoneAccess(function() {
        frame.join();
      });
    }

    function startCall() {
      var token = sessionStorage.getItem('daily_call_token') || '';
      var roomUrl = sessionStorage.getItem('daily_room_url') || '';
      sessionStorage.removeItem('daily_call_token');
      sessionStorage.removeItem('daily_room_url');

      if (token && roomUrl) {
        buildFrame(token, roomUrl);
        return;
      }

      var fd = new FormData();
      fd.append('room_name', roomName);
      fd.append('user_name', myName);
      fd.append('user_id', myId);
      fd.append('role', myRole);
      if (callId) fd.append('call_id', callId);

      fetch('../../controllers/call/token.php', { method: 'POST', body: fd })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.success && d.token) {
            buildFrame(d.token, d.room_url);
          } else {
            setStatus('Unable to connect', d.message || 'The call is no longer available.');
          }
        })
        .catch(function() { setStatus('Unable to connect', 'Could not reach the call server.'); });
    }

    muteBtn.onclick = function() {
      muted = !muted;
      if (frame) { try { frame.setLocalAudio(!muted); } catch(e) {} }
      muteBtn.classList.toggle('is-active', muted);
      muteBtn.title = muted ? 'Unmute' : 'Mute';
    };

    speakerBtn.onclick = function() {
      speakerOn = !speakerOn;
      if (frame && frame.setSpeaker) { try { frame.setSpeaker(speakerOn); } catch(e) {} }
      speakerBtn.classList.toggle('is-off', !speakerOn);
      speakerBtn.title = speakerOn ? 'Mute Speaker' : 'Turn On Speaker';
    };

    endBtn.onclick = function() { endCall('ended'); };

    retryMicBtn.onclick = function() {
      acquireMicrophoneAccess(function() {
        window.location.reload();
      });
    };

    var ringStart = Date.now();
    if (mode === 'caller' && callId) {
      ringInterval = setInterval(function() {
        if (endTriggered || connected) return;
        if ((Date.now() - ringStart) > 60000) {
          setStatus('No answer');
          var mfd = new FormData();
          mfd.append('call_id', callId);
          mfd.append('status', 'missed');
          fetch('../../controllers/call/update.php', { method: 'POST', body: mfd }).catch(function(){});
          setTimeout(function() { endCall('ended'); }, 900);
          return;
        }
        fetch('../../controllers/call/status.php?call_id=' + callId)
          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (d.success && d.call && (d.call.status === 'declined' || d.call.status === 'missed')) {
              setStatus('No answer');
              setTimeout(function() { endCall('ended'); }, 1100);
            } else if (d.success && d.call && d.call.status === 'ended' && !joined) {
              setStatus('Call ended');
              setTimeout(function() { endCall('ended'); }, 500);
            }
          }).catch(function(){});
      }, 2000);
    }

    startCall();
  })();
  </script>
</body>
</html>
