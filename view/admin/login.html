<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - HomeService Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-brand">HomeService<span>Pro</span></div>
          <div class="auth-subtitle">Administrator Login</div>
        </div>
        <div class="auth-body">
          <form onsubmit="return false;">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="admin@homeservicepro.com" />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Enter your password" />
            </div>
            <button class="btn btn-primary" type="button" onclick="window.location.href='dashboard.html'">Log In</button>
          </form>
        </div>
        <div class="auth-footer">
          This portal is restricted to authorized administrators.
        </div>
        <div class="auth-back">
          <a href="../customer/landing-page.html">&larr; Back to Home</a>
        </div>
      </div>
    </div>
    <script src="../shared.js"></script>
  </body>
</html>
