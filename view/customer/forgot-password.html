<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - HomeService Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared.css?v=5" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-brand">HomeService<span>Pro</span></div>
          <div class="auth-subtitle">Forgot Password</div>
        </div>
        <div class="auth-body">
          <form onsubmit="return false;">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="you@example.com" />
            </div>
            <button class="btn btn-primary" type="button" id="signupBtn">Submit</button>
          </form>
        </div>
        <div class="auth-footer">
          Already have an account? <a href="login.html">Log in</a>
        </div>
        <div class="auth-back">
          <a href="../customer/landing-page.html">&larr; Back to Home</a>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="confirmReset">
      <div class="modal">
        <div class="modal-header">
          <h3>Confirm Registration</h3>
          <button class="modal-close" onclick="closeModal('confirmReset')">&times;</button>
        </div>
        <div class="modal-body">
          Are you sure you want to reset your account password? Please ensure the email you entered is correct before proceeding.
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary btn-cancel" onclick="closeModal('confirmReset')">Cancel</button>
          <button class="btn btn-primary" id="confirmResetBtn">Confirm &amp; Submit</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="newPassword">
      <div class="modal">
        <div class="modal-header">
          <h3>Enter New Password</h3>
          <button class="modal-close" onclick="closeModal('newPassword')">&times;</button>
        </div>
        <div class="modal-body">
          <form onsubmit="return false;">
            <div class="form-group">
              <label for="password">Password</label>
              <div class="password-wrapper">
                <input type="password" id="password" placeholder="Create a password" />
                <button type="button" class="password-toggle" aria-label="Toggle password visibility" onclick="togglePassword(this)">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <div class="password-wrapper">
                <input type="password" id="confirmPassword" placeholder="Confirm your password" />
                <button type="button" class="password-toggle" aria-label="Toggle password visibility" onclick="togglePassword(this)">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary btn-cancel" onclick="closeModal('newPassword')">Cancel</button>
          <button class="btn btn-primary" id="newPasswordBtn">Confirm &amp; Submit</button>
        </div>
      </div>
    </div>

    <script src="../shared.js?v=5"></script>
    <script>



    function isValidPassword(p) {
         if (!p || p.length < 6 || /^\s*$/.test(p)) return false;
         return /[0-9]/.test(p) && /[^A-Za-z0-9]/.test(p);
    }

    document.getElementById('signupBtn').addEventListener('click', function() {
      var email = document.getElementById('email').value.trim();
      openModal('confirmReset');
    });
    document.getElementById('confirmResetBtn').addEventListener('click', function() {
      var email = document.getElementById('email').value.trim();
      var btn = this; var orig = btn.innerHTML;
      btn.innerHTML = 'Sending Email...'; btn.disabled = true;
      var fd = new FormData();
      fd.append('email', email); fd.append('role', 'customer'); fd.append('action', 'find-email');
      fetch('../../controllers/forgot-password.php', { method: 'POST', body: fd })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(data.success){
            closeModal('confirmReset');
            if(data.otp_sent === false){
              showAlert('Email not sent', 'warning');
              window.location.href = 'login.html';
              return;
            }
            startOtpChallenge({
              otp: data.otp,
              email: data.email,
              title: 'Confirm your email',
              message: 'Enter the 6-digit code we sent to',
              hint: 'This confirms your email address belongs to you.',
              verifyLabel: 'Confirm',
              onSuccess: function(){
                showAlert('Email confirmed!', 'success');
                openModal('newPassword');
              },
              onCancel: function(){ btn.innerHTML = orig; btn.disabled = false; }
            });
          } else { showAlert(data.error || 'Password reset failed', 'error'); btn.innerHTML = orig; btn.disabled = false; }
        })
        .catch(function(){ showAlert('Network error', 'error'); btn.innerHTML = orig; btn.disabled = false; });
    });

    document.getElementById('newPasswordBtn').addEventListener('click', function() {
      var password = document.getElementById('password').value;
      var confirmPassword = document.getElementById('confirmPassword').value;
      var email = document.getElementById('email').value.trim();
      if (!password || !confirmPassword) { showAlert('Please fill in all fields', 'warning'); return; }
      if (!isValidPassword(password)) { showAlert('Password must be at least 6 characters and include at least one number and one symbol (e.g. !@#$).', 'warning'); return; }
      if (password !== confirmPassword) { showAlert('Passwords do not match', 'warning'); return; }
      var btn = this; var orig = btn.innerHTML;
      btn.innerHTML = 'Creating Account...'; btn.disabled = true;
      var fd = new FormData();
      fd.append('password', password); fd.append('email', email); fd.append('role', 'customer'); fd.append('action', 'reset-password');
      fetch('../../controllers/forgot-password.php', { method: 'POST', body: fd })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(data.success){
            closeModal('newPassword');
            showAlert('Password reset successful', 'success');
            setTimeout(function(){ window.location.href = 'login.html'; }, 2000);
          } else { showAlert(data.error || 'Password reset failed', 'error'); btn.innerHTML = orig; btn.disabled = false; }
        })
        .catch(function(){ showAlert('Network error', 'error'); btn.innerHTML = orig; btn.disabled = false; });
    });
    </script>
  </body>
</html>
