<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages - HomeService Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared.css" />
  <style>
    .chat-layout {
      display: flex;
      height: calc(100vh - 0px);
      overflow: hidden;
    }

    .chat-sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--card-bg, #fff);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .chat-sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .chat-sidebar-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .chat-search {
      position: relative;
    }

    .chat-search input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.875rem;
      background: var(--bg, #f5f7fa);
      outline: none;
    }

    .chat-search input:focus {
      border-color: var(--primary);
    }

    .chat-search svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--muted);
    }

    .chat-contacts {
      flex: 1;
      overflow-y: auto;
    }

    .chat-contact {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .chat-contact:hover {
      background: var(--bg, #f5f7fa);
    }

    .chat-contact.active {
      background: rgba(27, 141, 232, 0.08);
      border-left: 3px solid var(--primary);
    }

    .chat-contact-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
      flex-shrink: 0;
    }

    .chat-contact-info {
      flex: 1;
      min-width: 0;
    }

    .chat-contact-name {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }

    .chat-contact-preview {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-contact-meta {
      text-align: right;
      flex-shrink: 0;
    }

    .chat-contact-time {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .chat-contact-unread {
      background: var(--primary);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
    }

    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg, #fff);
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1b8de8, #0d71c7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      color: #fff;
    }

    .chat-header-name {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .chat-header-status {
      font-size: 0.78rem;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .chat-header-status::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
    }

    .chat-header-actions {
      display: flex;
      gap: 8px;
    }

    .chat-header-actions button {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 10px;
      background: var(--bg, #f5f7fa);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text, #1a1a2e);
      transition: background 0.15s, color 0.15s;
    }

    .chat-header-actions button:hover {
      background: rgba(27, 141, 232, 0.1);
      color: var(--primary);
    }

    .chat-header-actions button svg {
      width: 18px;
      height: 18px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--bg, #f5f7fa);
    }

    .chat-bubble {
      max-width: 65%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.88rem;
      line-height: 1.5;
      position: relative;
    }

    .chat-bubble.received {
      align-self: flex-start;
      background: var(--card-bg, #fff);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .chat-bubble.sent {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .chat-bubble-time {
      font-size: 0.7rem;
      margin-top: 6px;
      opacity: 0.6;
    }

    .chat-bubble.sent .chat-bubble-time {
      text-align: right;
      color: #fff;
    }

    .chat-input-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--card-bg, #fff);
    }

    .chat-input-bar input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.88rem;
      outline: none;
      background: var(--bg, #f5f7fa);
    }

    .chat-input-bar input:focus {
      border-color: var(--primary);
    }

    .chat-send-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .chat-send-btn:hover {
      background: #0d71c7;
    }

    .chat-send-btn svg {
      width: 18px;
      height: 18px;
    }

    .incoming-modal {
      text-align: center;
      padding: 32px 28px;
      max-width: 340px;
    }

    .incoming-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.7rem;
      color: #fff;
      margin: 0 auto 16px;
      position: relative;
    }

    .incoming-avatar::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 3px solid #22c55e;
      animation: incomingPulse 1.6s ease-in-out infinite;
    }

    @keyframes incomingPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.1); }
    }

    .incoming-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .incoming-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .incoming-actions {
      display: flex;
      justify-content: center;
      gap: 40px;
    }

    .incoming-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: transform 0.15s, background 0.15s;
    }

    .incoming-btn:hover {
      transform: scale(1.08);
    }

    .incoming-btn svg {
      width: 24px;
      height: 24px;
    }

    .incoming-btn-accept {
      background: #22c55e;
    }

    .incoming-btn-accept:hover {
      background: #16a34a;
    }

    .incoming-btn-decline {
      background: #ef4444;
    }

    .incoming-btn-decline:hover {
      background: #dc2626;
    }

    .incoming-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <!-- Mobile responsive navigation -->
  <header class="hs-topbar" id="hsTopbar">
    <button class="hs-hamburger" id="hsHamburger" onclick="hsToggleSidebar()" aria-label="Open menu" aria-expanded="false">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="hs-topbar-brand">HomeService<span>Pro</span></div>
    <div class="hs-topbar-actions">
      <button class="hs-topbar-logout" onclick="hsCloseSidebar(); openModal('logoutModal')" aria-label="Log out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>
  <div class="hs-sidebar-backdrop" id="hsBackdrop" onclick="hsCloseSidebar()"></div>
  <div class="hs-chat-backdrop" id="hsChatBackdrop" onclick="hsCloseChatContacts()"></div>
  <style>
    .hs-topbar{display:none;position:fixed;top:0;left:0;right:0;height:56px;background:#0b1a26;color:#fff;align-items:center;gap:8px;padding:0 12px;z-index:300;box-shadow:0 2px 14px rgba(0,0,0,.3);}
    .hs-hamburger{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .hs-hamburger:hover{background:rgba(255,255,255,.08);}
    .hs-hamburger svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
    .hs-hamburger svg line{transition:transform .25s ease,opacity .2s ease;}
    .hs-topbar-brand{font-size:1.15rem;font-weight:800;letter-spacing:-.05em;color:#fff;white-space:nowrap;}
    .hs-topbar-brand span{color:#1b8de8;}
    .hs-topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
    .hs-topbar-logout{width:40px;height:40px;border:0;border-radius:10px;background:rgba(239,68,68,.1);color:#ef4444;align-items:center;justify-content:center;cursor:pointer;display:none;flex-shrink:0;}
    .hs-topbar-logout svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    @media(max-width:980px){.hs-topbar-logout{display:flex;}}
    .hs-sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(11,26,38,.5);z-index:90;}
    .hs-chat-contacts-btn{display:none;width:40px;height:40px;border:0;border-radius:10px;background:rgba(27,141,232,.08);color:#1b8de8;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
    .hs-chat-contacts-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .hs-chat-backdrop{display:none;position:fixed;inset:0;background:rgba(11,26,38,.5);z-index:210;}
    @media(max-width:980px){
      .hs-topbar{display:flex;}
      .main-content{margin-top:56px;}
      body.hs-sidebar-open{overflow:hidden;}
      body.hs-sidebar-open .hs-sidebar-backdrop{display:block;}
      body.hs-sidebar-open .sidebar{transform:translateX(0)!important;box-shadow:16px 0 48px rgba(0,0,0,.35);}
      body.hs-sidebar-open .hs-hamburger svg line:nth-child(1){transform:translateY(6px) rotate(45deg);transform-origin:center;}
      body.hs-sidebar-open .hs-hamburger svg line:nth-child(2){opacity:0;}
      body.hs-sidebar-open .hs-hamburger svg line:nth-child(3){transform:translateY(-6px) rotate(-45deg);transform-origin:center;}
      .main-content .header-actions{flex-wrap:wrap;}
      .chat-layout{height:calc(100vh - 56px)!important;}
    }
    .hs-chat-contacts-btn{display:none;width:40px;height:40px;border:0;border-radius:10px;background:rgba(27,141,232,.08);color:#1b8de8;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
    .hs-chat-contacts-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .hs-chat-backdrop{display:none;position:fixed;inset:0;background:rgba(11,26,38,.5);z-index:210;}
    @media(max-width:768px){
      .hs-chat-contacts-btn{display:flex;}
      .chat-sidebar{position:fixed!important;top:56px;left:0;bottom:0;width:min(320px,86vw)!important;max-height:none!important;transform:translateX(-105%);transition:transform .3s ease;z-index:220;box-shadow:16px 0 48px rgba(0,0,0,.35);}
      body.hs-chat-open .chat-sidebar{transform:translateX(0)!important;}
      body.hs-chat-open .hs-chat-backdrop{display:block;}
      .chat-main{width:100%;}
    }
  </style>
  <script>
    (function(){
      function hsToggleSidebar(){var open=document.body.classList.toggle('hs-sidebar-open');var b=document.getElementById('hsHamburger');if(b)b.setAttribute('aria-expanded',String(open));}
      function hsCloseSidebar(){document.body.classList.remove('hs-sidebar-open');var b=document.getElementById('hsHamburger');if(b)b.setAttribute('aria-expanded','false');}
      window.hsToggleSidebar=hsToggleSidebar;window.hsCloseSidebar=hsCloseSidebar;
      function hsToggleChatContacts(){document.body.classList.toggle('hs-chat-open');}
      function hsCloseChatContacts(){document.body.classList.remove('hs-chat-open');}
      window.hsToggleChatContacts=hsToggleChatContacts;window.hsCloseChatContacts=hsCloseChatContacts;
      document.addEventListener('click',function(e){
        if(e.target.closest('.sidebar-link')||e.target.closest('.sidebar-logout'))hsCloseSidebar();
        if(e.target.closest('.chat-contact'))hsCloseChatContacts();
      });
      window.addEventListener('resize',function(){if(window.innerWidth>980)hsCloseSidebar();});
    })();
  </script>

  <!-- SIDEBAR -->

    <div class="sidebar-brand">
      <div class="brand-text">HomeService<span>Pro</span></div>
      <div class="brand-sub">Customer Portal</div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">
        <div class="sidebar-section-label">Main Menu</div>

          Dashboard
        </a>
        <a href="book-service.html" class="sidebar-link">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg>
          Book Service
        </a>
        <a href="my-tickets.html" class="sidebar-link">
          <svg viewBox="0 0 24 24"><path d="M15 5v2"/><path d="M15 11v2"/><path d="M15 17v2"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>
          My Tickets
        </a>
        <a href="my-appliances.html" class="sidebar-link">
          <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>

        </a>
      </div>
    </nav>
    <div class="sidebar-user">
      <div class="sidebar-avatar"></div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name"></div>
        <div class="sidebar-user-role"></div>
      </div>
      <button class="sidebar-logout" onclick="openModal('logoutModal')" title="Log Out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content" style="padding: 0;">
    <div class="chat-layout">

      <!-- Chat Sidebar -->
      <div class="chat-sidebar">
        <div class="chat-sidebar-header">
          <h2>Messages</h2>
          <div class="chat-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

          </div>

        <div class="chat-contacts" id="chatContacts"></div>
      </div>

      <!-- Chat Main -->
      <div class="chat-main">
        <div class="chat-header">
          <div class="chat-header-left">
            <button class="hs-chat-contacts-btn" id="hsChatContactsBtn" onclick="hsToggleChatContacts()" aria-label="Show contacts">
              <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </button>

  <!-- Incoming Call Modal -->
  <div class="modal-overlay" id="incomingCallModal">
    <div class="modal">
      <div class="incoming-modal">
        <div class="incoming-avatar" id="incomingCallerInitials">?</div>
        <div class="incoming-title" id="incomingCallerName">Incoming Call...</div>
        <div class="incoming-sub">is calling you...</div>
        <div class="incoming-actions">
          <div>
            <button class="incoming-btn incoming-btn-decline" id="declineCallBtn" title="Decline">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </button>
            <div class="incoming-label">Decline</div>
          </div>
          <div>
            <button class="incoming-btn incoming-btn-accept" id="acceptCallBtn" title="Accept">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </button>
            <div class="incoming-label">Accept</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Logout Modal -->
  <div class="modal-overlay" id="logoutModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Log Out</h3>
        <button class="modal-close" onclick="closeModal('logoutModal')">&times;</button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to log out of your account?</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-cancel" onclick="closeModal('logoutModal')">Cancel</button>
        <button class="btn btn-danger" id="logoutBtn">Log Out</button>
      </div>
    </div>
  </div>

  <script src="../shared.js"></script>
  <script src="../is-active.js"></script>
  <script>
  (function() {
    if (!localStorage.getItem('is_logged_in')) { window.location.href = 'login.html'; return; }

    var userId = localStorage.getItem('id');
    var userName = localStorage.getItem('name') || 'Customer';
    
    // Get ticket_id and repairman_id from URL if present
    var urlParams = new URLSearchParams(window.location.search);
    var ticketIdFromUrl = urlParams.get('ticket_id');
    var repairmanIdFromUrl = urlParams.get('repairman_id');

    document.querySelectorAll('.sidebar-user-name').forEach(function(el) { el.textContent = userName; });
    var initials = userName.split(' ').map(function(w){ return w[0]; }).join('').substring(0,2).toUpperCase();
    document.querySelectorAll('.sidebar-avatar').forEach(function(el) { el.textContent = initials; });

    function logout() {
      fetch('../../controllers/logout.php', { method: 'POST' })
        .then(function(){ localStorage.clear(); window.location.href = 'login.html'; })
        .catch(function(){ localStorage.clear(); window.location.href = 'login.html'; });
    }
    document.querySelectorAll('#logoutModal .btn-danger').forEach(function(btn) { btn.onclick = logout; });

    var contactsContainer = document.getElementById('chatContacts');
    var messagesContainer = document.getElementById('chatMessages');
    var chatInput = document.querySelector('.chat-input-bar input');
    var sendBtn = document.querySelector('.chat-send-btn');
    var chatHeaderName = document.querySelector('.chat-header-name');
    var chatHeaderAvatar = document.querySelector('.chat-header-avatar');

    var currentContactId = null;
    var currentContactRole = 'repairman';
    var eventSource = null;
    var initialMessageSent = false;

    var gradients = [
      'linear-gradient(135deg, #1b8de8, #0d71c7)',
      'linear-gradient(135deg, #22c55e, #16a34a)',
      'linear-gradient(135deg, #8b5cf6, #7c3aed)',
      'linear-gradient(135deg, #f59e0b, #d97706)',
      'linear-gradient(135deg, #ef4444, #dc2626)'
    ];

    function ensureInitialMessage(contactId, contactRole, ticketId) {
      return new Promise(function(resolve, reject) {
        console.log('ensureInitialMessage called with:', contactId, contactRole, ticketId);
        
        // Check if conversation already has messages
        fetch('../../controllers/chat/messages.php?user_id=' + userId + '&user_role=customer&contact_id=' + contactId + '&contact_role=' + contactRole)
          .then(function(r) { 
            console.log('Messages API response status:', r.status);
            return r.json(); 
          })
          .then(function(data) {
            console.log('Existing messages:', data.messages ? data.messages.length : 0);
            if (!data.messages || !data.messages.length) {
              // No messages yet, send initial message
              console.log('Sending initial message...');
              var formData = new FormData();
              formData.append('sender_id', userId);
              formData.append('sender_role', 'customer');
              formData.append('receiver_id', contactId);
              formData.append('receiver_role', contactRole);
              var initialMsg = 'Hello! I have submitted repair ticket #' + ticketId + '. Looking forward to your assistance!';
              formData.append('message', initialMsg);
              
              fetch('../../controllers/chat/messages.php', {
                method: 'POST',
                body: formData
              })
              .then(function(r2) { 
                console.log('Send message response:', r2.status);
                return r2.json(); 
              })
              .then(function(result) {
                console.log('Message sent result:', result);
                resolve(result);
              })
              .catch(function(err) {
                console.error('Failed to send initial message:', err);
                resolve(false);
              });
            } else {
              console.log('Conversation already exists, skipping initial message');
              resolve(true);
            }
          })
          .catch(function(err) {
            console.error('Failed to check existing messages:', err);
            resolve(false);
          });
      });
    }

    // If coming from ticket with repairman_id, set up the conversation
    var hasUrlParams = !!(ticketIdFromUrl && repairmanIdFromUrl);
    if (hasUrlParams && userId) {
      console.log('Chat: URL params detected - ticket:', ticketIdFromUrl, 'repairman:', repairmanIdFromUrl);
      currentContactId = repairmanIdFromUrl;
      currentContactRole = 'repairman';
      initialMessageSent = false;
      
      // Set header info immediately
      if (chatHeaderName) chatHeaderName.textContent = 'Repairman (Ticket #' + ticketIdFromUrl + ')';
      if (chatHeaderAvatar) chatHeaderAvatar.textContent = 'RP';
      
      // Ensure initial message is sent BEFORE loading contacts
      ensureInitialMessage(repairmanIdFromUrl, 'repairman', ticketIdFromUrl).then(function() {
        console.log('Chat: Initial message handled');
        // Now load the specific conversation
        loadMessages(repairmanIdFromUrl, 'repairman');
        
        // Also highlight/select this contact in the sidebar
        setTimeout(function() {
          var contactEl = document.querySelector('.chat-contact[data-contact-id="' + repairmanIdFromUrl + '"]');
          if (contactEl) {
            contactEl.click();
          }
        }, 800);
      });
    } else if (hasUrlParams && !userId) {
      console.error('Chat: Missing userId');
    } else if (!hasUrlParams) {
      console.log('Chat: No URL params, loading normal contacts');
    }

function loadContacts() {
        if (!userId || !contactsContainer) return;
        fetch('../../controllers/chat/contacts.php?user_id=' + userId + '&user_role=customer')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (!data.contacts) return;
            contactsContainer.innerHTML = '';
            if (!data.contacts.length) {
              contactsContainer.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.9rem;">No conversations yet.</div>';
              if (messagesContainer) {
                messagesContainer.innerHTML = '<div class="empty-state" style="text-align:center;padding:60px 20px;color:var(--muted);font-size:0.9rem;">' +
                  '<svg viewBox="0 0 24 24" style="width:48px;height:48px;stroke:var(--soft);fill:none;stroke-width:1.5;margin-bottom:16px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
                  '<p>No contacts available. Start a conversation when you book a service.</p></div>';
              }
              if (chatHeaderName) chatHeaderName.textContent = 'Select a conversation';
              if (chatHeaderAvatar) chatHeaderAvatar.textContent = '';
              currentContactId = null;
              currentContactRole = 'repairman';
              return;
            }
            data.contacts.forEach(function(c, i) {
            var contactInitials = (c.name || 'U').split(' ').map(function(w){ return w[0]; }).join('').substring(0,2).toUpperCase();
            var div = document.createElement('div');
            div.className = 'chat-contact';
            div.setAttribute('data-contact-id', c.id);
            div.setAttribute('data-contact-role', c.role || 'repairman');
            div.innerHTML = '<div class="chat-contact-avatar" style="background: ' + (gradients[i % gradients.length]) + ';">' + contactInitials + '</div>' +
              '<div class="chat-contact-info"><div class="chat-contact-name">' + (c.name || '') + '</div>' +
              '<div class="chat-contact-preview">' + (c.last_message || '') + '</div></div>' +
              '<div class="chat-contact-meta"><div class="chat-contact-time">' + (c.last_time || '') + '</div>' +
              (c.unread ? '<div class="chat-contact-unread">' + c.unread + '</div>' : '') + '</div>';
            div.onclick = function() {
              document.querySelectorAll('.chat-contact').forEach(function(el) { el.classList.remove('active'); });
              div.classList.add('active');
              currentContactId = c.id;
              currentContactRole = c.role || 'repairman';
              if (chatHeaderName) chatHeaderName.textContent = c.name || '';
              if (chatHeaderAvatar) chatHeaderAvatar.textContent = contactInitials;
              loadMessages(c.id, currentContactRole);
            };
            contactsContainer.appendChild(div);
          });

          if (data.contacts && data.contacts.length > 0) {
            var first = data.contacts[0];
            currentContactId = first.id;
            currentContactRole = first.role || 'repairman';
            var firstInit = (first.name || 'U').split(' ').map(function(w){ return w[0]; }).join('').substring(0,2).toUpperCase();
            if (chatHeaderName) chatHeaderName.textContent = first.name || '';
            if (chatHeaderAvatar) chatHeaderAvatar.textContent = firstInit;
            loadMessages(first.id, currentContactRole);
          }
        })
        .catch(function() {});
    }

    function loadMessages(contactId, contactRole) {
      if (!userId || !messagesContainer) return;
      fetch('../../controllers/chat/messages.php?user_id=' + userId + '&user_role=customer&contact_id=' + contactId + '&contact_role=' + (contactRole || 'repairman'))
        .then(function(r) { return r.json(); })
        .then(function(data) {
messagesContainer.innerHTML = '';
            if (!data.messages || !data.messages.length) {
              messagesContainer.innerHTML = '<div class="empty-state" style="text-align:center;padding:60px 20px;color:var(--muted);font-size:0.9rem;">' +
                '<svg viewBox="0 0 24 24" style="width:48px;height:48px;stroke:var(--soft);fill:none;stroke-width:1.5;margin-bottom:16px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
                '<p>No messages yet. Start the conversation!</p></div>';
              return;
            }
            data.messages.forEach(function(m) {
            var isSent = String(m.sender_id) === String(userId);
            var time = m.time || m.created_at || '';
            if (time && time.length > 5) {
              var d = new Date(time);
              var h = d.getHours();
              var min = String(d.getMinutes()).padStart(2, '0');
              var ampm = h >= 12 ? 'PM' : 'AM';
              h = h % 12 || 12;
              time = h + ':' + min + ' ' + ampm;
            }
            var div = document.createElement('div');
            div.className = 'chat-bubble ' + (isSent ? 'sent' : 'received');
            div.innerHTML = (m.message || m.content || '') + '<div class="chat-bubble-time">' + time + '</div>';
            messagesContainer.appendChild(div);
          });
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        })
        .catch(function() {});
    }

    function sendMessage() {
      if (!chatInput || !currentContactId || !userId) return;
      var msg = chatInput.value.trim();
      if (!msg) return;
      chatInput.value = '';

      var formData = new FormData();
      formData.append('sender_id', userId);
      formData.append('sender_role', 'customer');
      formData.append('receiver_id', currentContactId);
      formData.append('receiver_role', currentContactRole);
      formData.append('message', msg);

      fetch('../../controllers/chat/messages.php', {
        method: 'POST',
        body: formData
      }).then(function() {
        loadMessages(currentContactId, currentContactRole);
      }).catch(function() {});
    }

    if (sendBtn) sendBtn.onclick = sendMessage;
    if (chatInput) {
      chatInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
      });
    }

function startSSE() {
        if (!userId || !currentContactId) return;
        if (eventSource) eventSource.close();
        eventSource = new EventSource('../../controllers/chat/stream.php?user_id=' + userId + '&user_role=customer&contact_id=' + currentContactId + '&contact_role=' + currentContactRole);
      eventSource.onmessage = function(e) {
        try {
          var d = JSON.parse(e.data);
          if (d.type === 'new_message' && String(d.sender_id) === String(currentContactId)) {
            loadMessages(currentContactId, currentContactRole);
          } else if (d.type === 'new_message') {
            loadContacts();
          }
        } catch(err) {}
      };
      eventSource.onerror = function() {};
    }

    // ===== VOICE CALL =====
    var voiceCallBtn = document.getElementById('voiceCallBtn');
    var incomingModalShown = false;
    var incomingCallData = null;

    function startVoiceCall() {
      if (!currentContactId) {
        showAlert('Select a conversation first to start a call.', 'warning');
        return;
      }
      var activeEl = document.querySelector('.chat-contact.active .chat-contact-name');
      var contactName = activeEl ? activeEl.textContent : 'Contact';

      var fd = new FormData();
      fd.append('caller_id', userId);
      fd.append('caller_role', 'customer');
      fd.append('caller_name', userName);
      fd.append('callee_id', currentContactId);
      fd.append('callee_role', currentContactRole || 'repairman');
      fd.append('callee_name', contactName);

      fetch('../../controllers/call/create-room.php', { method: 'POST', body: fd })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.success) {
            sessionStorage.setItem('daily_call_token', d.token);
            sessionStorage.setItem('daily_room_url', d.room_url);
            window.location.href = 'call.html?room=' + encodeURIComponent(d.room_name) +
              '&call_id=' + d.call_id + '&mode=caller&contact_name=' + encodeURIComponent(d.callee_name || contactName);
          } else {
            showAlert(d.message || 'Could not start the call.', 'error');
          }
        })
        .catch(function() { showAlert('Could not start the call. Please try again.', 'error'); });
    }

    if (voiceCallBtn) voiceCallBtn.onclick = startVoiceCall;

    function showIncomingCallModal(call) {
      if (incomingModalShown) return;
      incomingModalShown = true;
      incomingCallData = call;
      var name = call.caller_name || 'Unknown';
      document.getElementById('incomingCallerName').textContent = name;
      var initials = name.split(' ').map(function(w){ return w[0]; }).join('').substring(0,2).toUpperCase();
      document.getElementById('incomingCallerInitials').textContent = initials;
      openModal('incomingCallModal');
    }

    function checkIncomingCall() {
      if (!userId || incomingModalShown) return;
      fetch('../../controllers/call/incoming.php?user_id=' + userId + '&user_role=customer')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.success && d.has_incoming && d.call) showIncomingCallModal(d.call);
        })
        .catch(function() {});
    }

    function acceptIncomingCall() {
      if (!incomingCallData) return;
      var call = incomingCallData;
      var fd = new FormData();
      fd.append('call_id', call.call_id);
      fd.append('status', 'answered');
      fetch('../../controllers/call/update.php', { method: 'POST', body: fd }).catch(function(){});

      var tfd = new FormData();
      tfd.append('room_name', call.room_name);
      tfd.append('user_name', userName);
      tfd.append('user_id', userId);
      tfd.append('role', 'customer');
      tfd.append('call_id', call.call_id);

      fetch('../../controllers/call/token.php', { method: 'POST', body: tfd })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.success) {
            sessionStorage.setItem('daily_call_token', d.token);
            sessionStorage.setItem('daily_room_url', d.room_url);
            closeModal('incomingCallModal');
            incomingModalShown = false;
            window.location.href = 'call.html?room=' + encodeURIComponent(call.room_name) +
              '&call_id=' + call.call_id + '&mode=callee&contact_name=' + encodeURIComponent(call.caller_name || '');
          } else {
            closeModal('incomingCallModal');
            incomingModalShown = false;
            showAlert(d.message || 'Could not join the call.', 'error');
          }
        })
        .catch(function() {
          closeModal('incomingCallModal');
          incomingModalShown = false;
          showAlert('Could not join the call.', 'error');
        });
    }

    function declineIncomingCall() {
      if (incomingCallData) {
        var fd = new FormData();
        fd.append('call_id', incomingCallData.call_id);
        fd.append('status', 'declined');
        fetch('../../controllers/call/update.php', { method: 'POST', body: fd }).catch(function(){});
      }
      incomingModalShown = false;
      incomingCallData = null;
      closeModal('incomingCallModal');
    }

    document.getElementById('acceptCallBtn').onclick = acceptIncomingCall;
    document.getElementById('declineCallBtn').onclick = declineIncomingCall;

    setInterval(checkIncomingCall, 3000);
    checkIncomingCall();

    loadContacts();
    startSSE();
  })();
  </script>
</body>
</html>
