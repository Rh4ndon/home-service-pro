<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - HomeService Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-brand">HomeService<span>Pro</span></div>
          <div class="auth-subtitle">Create Customer Account</div>
        </div>
        <div class="auth-body">
          <form onsubmit="return false;">
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" placeholder="John Doe" />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="you@example.com" />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="password-wrapper">
                <input type="password" id="password" placeholder="Create a password" />
                <button type="button" class="password-toggle" aria-label="Toggle password visibility" onclick="togglePassword(this)">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <div class="password-wrapper">
                <input type="password" id="confirmPassword" placeholder="Confirm your password" />
                <button type="button" class="password-toggle" aria-label="Toggle password visibility" onclick="togglePassword(this)">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <button class="btn btn-primary" type="button" id="signupBtn">Create Account</button>
          </form>
        </div>
        <div class="auth-footer">
          Already have an account? <a href="login.html">Log in</a>
        </div>
        <div class="auth-back">
          <a href="../customer/landing-page.html">&larr; Back to Home</a>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="confirmSignup">
      <div class="modal">
        <div class="modal-header">
          <h3>Confirm Registration</h3>
          <button class="modal-close" onclick="closeModal('confirmSignup')">&times;</button>
        </div>
        <div class="modal-body">
          Are you sure you want to create a customer account? Please ensure all your details are correct before proceeding.
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary btn-cancel" onclick="closeModal('confirmSignup')">Cancel</button>
          <button class="btn btn-primary" id="confirmSignupBtn">Confirm &amp; Sign Up</button>
        </div>
      </div>
    </div>

    <script src="../shared.js"></script>
    <script>
    document.getElementById('signupBtn').addEventListener('click', function() {
      var name = document.getElementById('fullName').value.trim();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var confirmPassword = document.getElementById('confirmPassword').value;
      if (!name || !email || !password || !confirmPassword) { alert('Please fill in all fields'); return; }
      if (password !== confirmPassword) { alert('Passwords do not match'); return; }
      openModal('confirmSignup');
    });
    document.getElementById('confirmSignupBtn').addEventListener('click', function() {
      var name = document.getElementById('fullName').value.trim();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var btn = this; var orig = btn.innerHTML;
      btn.innerHTML = 'Creating Account...'; btn.disabled = true;
      var fd = new FormData();
      fd.append('name', name); fd.append('email', email); fd.append('password', password); fd.append('role', 'customer');
      fetch('../../controllers/register.php', { method: 'POST', body: fd })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(data.success){
            alert('Account created successfully!');
            window.location.href = 'login.html';
          } else { alert(data.error || 'Registration failed'); btn.innerHTML = orig; btn.disabled = false; }
        })
        .catch(function(){ alert('Network error'); btn.innerHTML = orig; btn.disabled = false; });
    });
    </script>
  </body>
</html>
