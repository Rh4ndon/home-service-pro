<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Call - HomeService Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared.css" />
  <style>
    .call-page {
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 0px);
      background: linear-gradient(135deg, #0b1a26 0%, #162d3f 50%, #1b8de8 100%);
    }

    .call-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 48px 40px;
      text-align: center;
      width: 360px;
    }

    .call-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1b8de8, #0d71c7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 2rem;
      color: #fff;
      margin: 0 auto 20px;
      position: relative;
    }

    .call-avatar.active-call::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 3px solid #22c55e;
      animation: callPulse 2s ease-in-out infinite;
    }

    @keyframes callPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.05); }
    }

    .call-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .call-status {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 12px;
    }

    .call-timer {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }

    .call-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .call-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.15s;
    }

    .call-btn:hover {
      transform: scale(1.08);
    }

    .call-btn svg {
      width: 22px;
      height: 22px;
    }

    .call-btn-mute {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .call-btn-mute:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .call-btn-speaker {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .call-btn-speaker:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .call-btn-end {
      background: #ef4444;
      color: #fff;
      width: 64px;
      height: 64px;
    }

    .call-btn-end:hover {
      background: #dc2626;
    }

    .call-btn-chat {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .call-btn-chat:hover {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-text">HomeService<span>Pro</span></div>
      <div class="brand-sub">Customer Portal</div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">
        <div class="sidebar-section-label">Main Menu</div>
        <a href="dashboard.html" class="sidebar-link">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>
        <a href="book-service.html" class="sidebar-link">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg>
          Book Service
        </a>
        <a href="my-tickets.html" class="sidebar-link">
          <svg viewBox="0 0 24 24"><path d="M15 5v2"/><path d="M15 11v2"/><path d="M15 17v2"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>
          My Tickets
        </a>
        <a href="my-appliances.html" class="sidebar-link">
          <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          My Appliances
        </a>
        <a href="chat.html" class="sidebar-link">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Messages
        </a>
        <a href="profile.html" class="sidebar-link">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </a>
      </div>
    </nav>
    <div class="sidebar-user">
      <div class="sidebar-avatar">JD</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name">Juan Dela Cruz</div>
        <div class="sidebar-user-role">Customer</div>
      </div>
      <button class="sidebar-logout" onclick="openModal('logoutModal')" title="Log Out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content" style="padding: 0;">
    <div class="call-page">
      <div class="call-card">
        <div class="call-avatar active-call">PS</div>
        <div class="call-name">Pedro Santos</div>
        <div class="call-status">Voice Call</div>
        <div class="call-timer">03:24</div>
        <div class="call-actions">
          <button class="call-btn call-btn-mute" title="Mute">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <button class="call-btn call-btn-speaker" title="Speaker">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </button>
          <a href="chat.html" style="text-decoration:none; color:inherit;">
            <button class="call-btn call-btn-end" title="End Call">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </button>
          </a>
          <a href="chat.html" style="text-decoration:none; color:inherit;">
            <button class="call-btn call-btn-chat" title="Chat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </button>
          </a>
          <button class="call-btn call-btn-mute" title="Keypad">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Logout Modal -->
  <div class="modal-overlay" id="logoutModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Log Out</h3>
        <button class="modal-close" onclick="closeModal('logoutModal')">&times;</button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to log out of your account?</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-cancel" onclick="closeModal('logoutModal')">Cancel</button>
        <button class="btn btn-danger" onclick="window.location.href='login.html'">Log Out</button>
      </div>
    </div>
  </div>

  <script src="../shared.js"></script>
</body>
</html>
