<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden - HomeService Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Inter", sans-serif; background: #edf2f5; }
    .error-card { background: #fff; border-radius: 18px; padding: 48px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.06); max-width: 420px; }
    .error-code { font-size: 4rem; font-weight: 800; color: #ef4444; letter-spacing: -0.05em; }
    .error-msg { font-size: 1.1rem; color: #5e6977; margin: 12px 0 28px; }
    a { display: inline-block; padding: 12px 24px; background: #1b8de8; color: #fff; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
    a:hover { background: #0f79d4; }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">403</div>
    <div class="error-msg">Access to this directory is forbidden.</div>
    <a href="../../index.html">Back to Home</a>
  </div>
</body>
</html>
